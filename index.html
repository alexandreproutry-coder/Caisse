<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Caisse Comptoir 360</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1c3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caisse">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== Charte : changer ces valeurs pour reprendre celles de Comptoir 360 ===== */
:root{
  --primary:#0d1c3b;      /* bleu nuit Comptoir 360 */
  --accent:#b03249;       /* rouge « 360 » */
  --gold:#d0ae71;         /* or du logo */
  --serif:"Playfair Display",Georgia,serif;
  --bg:#f3f4f6;--surface:#ffffff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;
  --ok:#15803d;--warn:#b91c1c;--radius:12px;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.4;cursor:default}
.noselect{-webkit-user-select:none;user-select:none}

header{flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;height:64px;background:var(--primary);color:#fff;border-bottom:2px solid var(--gold)}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.brand img{display:block;height:34px;width:auto;max-width:100%;object-fit:contain;object-position:left center}
.brand small{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden}
.brand small .sep{color:var(--gold);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;flex:none}
.dot.ok{background:#22c55e}.dot.wait{background:#f59e0b}
.hbtn{height:38px;padding:0 14px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:15px}
.hbtn.on{background:var(--gold);color:var(--primary)}

#caisse{flex:1;min-height:0;display:flex;flex-direction:column}
@media(min-width:900px){#caisse{flex-direction:row}}
.catalog{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px}
.editbar{display:flex;align-items:center;gap:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;font-weight:600;font-size:15px}
.editbar span{flex:1}
.editbar button{background:#9a3412;color:#fff;border-radius:8px;padding:9px 14px;font-weight:700}
.fixbar{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
.fixbar button{background:#1e3a8a}
.tag-mod{display:inline-block;font-size:11px;font-weight:700;color:#1e3a8a;background:#eff6ff;border-radius:5px;padding:1px 6px;margin-left:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 16px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
@media(max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;min-height:112px;background:var(--c,var(--accent));color:#fff;border:0;border-radius:var(--radius);padding:14px 12px 12px;box-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.tile:active{filter:brightness(.88);box-shadow:none}
.tile:has(.badge) .nom,.tile:has(.tag) .nom{padding-right:34px}
.tile .nom{font-weight:700;font-size:16px;line-height:1.25;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .bot{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;width:100%;margin-top:8px;flex-wrap:wrap}
.tile .prix{font-weight:800;font-size:20px}
.stk{font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:6px;white-space:nowrap}
.stk.low{background:#fde68a;color:#78350f}
.stk.out{background:#fff;color:#b91c1c}
.tile .badge{position:absolute;top:12px;right:8px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:#fff;color:var(--c,var(--accent));font-weight:800;font-size:14px;display:grid;place-items:center}
.tile .tag{position:absolute;top:12px;right:8px;font-size:12px;font-weight:700;color:var(--c,var(--ink));background:#fff;border-radius:6px;padding:3px 7px}
.tile.ghost{border:1.5px dashed #cbd5e1;background:transparent;color:var(--muted);box-shadow:none}
.tile.ghost .prix{font-size:16px;font-weight:600}
.tile.add{border:1.5px dashed var(--primary);background:transparent;box-shadow:none;justify-content:center;align-items:center;text-align:center;color:var(--primary);font-weight:700}
.empty{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px 20px;text-align:center}
.empty h3{margin:0 0 6px}
.empty p{color:var(--muted);margin:0 0 16px}

.ticket{flex:none;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--line);max-height:60%;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
@media(min-width:900px){.ticket{width:380px;max-height:none;border-top:0;border-left:1px solid var(--line);box-shadow:none}}
.thead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px;font-weight:700;font-size:15px;width:100%;text-align:left}
.thead .arrow{color:var(--muted);font-weight:600;font-size:13px}
.holdbar{margin:6px 16px 0;height:40px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-weight:700;font-size:15px}
.tlist{display:none;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px}
.ticket.open .tlist{display:block}
@media(min-width:900px){.tlist{display:block}.thead .arrow{display:none}}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.2}
.row .n small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.qb{width:40px;height:40px;border-radius:8px;background:var(--bg);font-size:22px;font-weight:600}
.row .q{min-width:24px;text-align:center;font-weight:700}
.qset{min-width:46px!important;height:40px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:17px}
.row .lt{min-width:76px;text-align:right;font-weight:700}
.tactions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
.hint{color:var(--muted);text-align:center;padding:14px 0;margin:0}
.tfoot{display:flex;align-items:center;gap:12px;padding:8px 16px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.total{flex:1;min-width:0}
.total .lbl{font-size:13px;color:var(--muted)}
.total .val{font-size:30px;font-weight:800;letter-spacing:-.02em}
.pay{height:56px;padding:0 26px;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:18px;font-weight:700}

.modal{position:fixed;inset:0;z-index:20;background:rgba(17,24,39,.5);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center}}
.sheet{width:100%;max-width:500px;max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:16px 16px 0 0;padding:20px 18px;padding-bottom:max(20px,env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{border-radius:16px}}
.mt{font-family:var(--serif);font-size:22px;font-weight:700;margin:0 0 4px;color:var(--primary)}
.sub{color:var(--muted);margin:4px 0 14px;font-size:15px}
.big{font-size:40px;font-weight:800;letter-spacing:-.02em;text-align:center}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{height:72px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);font-size:17px;font-weight:700}
.choice:active{background:var(--bg)}
.display{font-size:34px;font-weight:700;text-align:center;padding:10px;border-radius:var(--radius);background:var(--bg);margin:12px 0 10px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kp button{height:56px;border-radius:10px;background:var(--bg);font-size:24px;font-weight:600}
.kp button:active{background:var(--line)}
.btn{width:100%;height:52px;border-radius:var(--radius);background:var(--bg);font-size:16px;font-weight:700}
.btn.primary{background:var(--ok);color:#fff}
.btn.dark{background:var(--primary);color:#fff}
.btn.danger{background:#fef2f2;color:var(--warn)}
.btn.line{background:var(--surface);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px}
.field label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.field input{width:100%;height:50px;padding:0 14px;border-radius:10px;border:1px solid #d1d5db;font-family:inherit;font-size:18px;color:var(--ink);background:#fff}
.field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,41,55,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px}
.sw{position:relative;width:100%;aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.sw.custom{background:conic-gradient(#e11d48,#a16207,#166534,#0e7490,#1e40af,#86198f,#e11d48);display:block}
.sw.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.preview{display:flex;justify-content:center;margin:10px 0 2px}
.preview .tile{width:180px;pointer-events:none}
.err{color:var(--warn);font-weight:600;min-height:1.2em;margin:8px 0 0;font-size:14px}
.rendu{border-radius:var(--radius);padding:12px;text-align:center;font-weight:700;background:#f0fdf4;color:var(--ok)}
.rendu.warn{background:#fef2f2;color:var(--warn)}
.rendu.idle{background:var(--bg);color:var(--muted);font-weight:500;font-size:14px}
.rendu .big{color:inherit}
.success{text-align:center}
.success .check{width:64px;height:64px;border-radius:50%;background:#f0fdf4;color:var(--ok);display:grid;place-items:center;margin:4px auto 10px}

#bilan{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.bwrap{max-width:1000px;margin:0 auto;padding:16px 12px 40px}
.bwrap h2{font-family:var(--serif);font-size:26px;margin:0 0 12px;color:var(--primary)}
.card h3{font-family:var(--serif);font-size:17px;margin:0 0 10px;color:var(--primary)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
.kpi.main{background:var(--primary);border-color:var(--primary);color:#fff;border-bottom:3px solid var(--gold)}
.kpi.main .l{color:rgba(255,255,255,.75)}
.cards{display:grid;gap:10px}
@media(min-width:800px){.cards{grid-template-columns:1fr 1fr}}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.bar .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{display:block;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .vv{font-weight:700;white-space:nowrap}
.sale{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sale .t{font-weight:700;min-width:44px}
.sale .d{flex:1;min-width:0;color:var(--muted)}
.sale .d b{color:var(--ink);font-weight:600}
.sale .s{font-weight:700;white-space:nowrap}
.sale .del{color:var(--warn);font-weight:600;font-size:13px;padding:4px 6px;border-radius:6px;background:#fef2f2}
.sale .del.fx{color:#1e3a8a;background:#eff6ff;padding:6px 10px}
.muted{color:var(--muted)}
.retrait{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.retrait>div{border-radius:10px;padding:10px 12px;background:#f0fdf4;color:var(--ok)}
.retrait>div+div{background:#eff6ff;color:#1e3a8a}
.retrait span{display:block;font-size:13px;font-weight:600}
.retrait b{display:block;font-size:24px;font-weight:800;margin:2px 0}
.retrait small{font-size:12px;opacity:.8}
.rrow{display:grid;grid-template-columns:12px 1fr 40px 64px 40px;gap:8px;align-items:center;padding:4px 0}
.rrow .sdot{width:12px;height:12px;border-radius:50%}
.rrow .sn{font-weight:600;font-size:15px;min-width:0}
.rrow .sn small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.rrow input{height:40px;width:100%;text-align:center;font-size:18px;font-weight:700;border:1px solid #d1d5db;border-radius:8px;font-family:inherit;color:var(--ink)}
.cnt{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:64px 40px 1fr 40px 84px;gap:8px;align-items:center}
.crow .cl{font-weight:700;font-size:15px;background:#fef9c3;color:#713f12;border-radius:6px;padding:6px 0;text-align:center}
.crow.bill .cl{background:#dbeafe;color:#1e3a8a}
.crow input{height:40px;width:100%;text-align:center;font-size:18px;font-weight:700;border:1px solid #d1d5db;border-radius:8px;font-family:inherit;color:var(--ink)}
.crow .cs{text-align:right;font-weight:600;font-size:14px;color:var(--muted)}
.srow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow .sdot{width:12px;height:12px;border-radius:50%;flex:none}
.srow .sn{flex:1;min-width:0;font-weight:600;font-size:15px}
.srow .sn small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.srow .stk{min-width:64px;text-align:center;font-size:14px;padding:5px 8px}
.srow .stk.okk{background:#f0fdf4;color:var(--ok)}
.srow .stk.out{background:#fef2f2}
.sset{border:1px solid currentColor;height:40px;font-family:inherit}
.exports{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.exports .btn{flex:1;min-width:180px}
textarea.csv{width:100%;height:160px;font-family:ui-monospace,monospace;font-size:12px;border-radius:10px;border:1px solid var(--line);padding:8px}
#toast{position:fixed;left:50%;top:68px;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
[hidden]{display:none!important}
</style>
</head>

<script>
const CATS=["Whisky","Rhums","Liqueurs","Sturia","Autres"];
const COLORS=["#e11d48","#b03249","#7e203a","#5c1428","#be185d","#86198f","#6b21a8","#4338ca","#1e40af","#2c4a7a","#0d1c3b","#0e7490","#0f766e","#166534","#3f6212","#4d6b3c","#a16207","#b8924f","#b45309","#c2410c","#9a3412","#8a5a2b","#6b4423","#4b5563","#374151","#111827"];
const SEUIL=3;
const PAY={especes:"Espèces",carte:"Carte",cheque:"Chèque"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=c=>((c||0)/100).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const parseEur=s=>{const n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isFinite(n)?Math.round(n*100):NaN};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayLabel=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const centsToStr=c=>(c/100).toFixed(2).replace(".",",").replace(/,00$/,"");

const DENOMS=[50000,20000,10000,5000,2000,1000,500,200,100,50,20,10,5,2,1];
const denLabel=c=>c>=100?(c/100)+" €":c+" c";
function normCount(o){const r={};if(o&&typeof o==="object")DENOMS.forEach(d=>{const q=Math.round(+o[d]||0);if(q>0)r[d]=q});return r}
const countTotal=o=>DENOMS.reduce((s,d)=>s+d*(o[d]||0),0);
function normCaisses(o){const r={};if(o&&typeof o==="object")Object.keys(o).forEach(k=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;const x=o[k]||{};r[k]={fond:Math.max(0,Math.round(+x.fond||0)),fondDetail:normCount(x.fondDetail),cloture:x.cloture&&typeof x.cloture==="object"?{compte:Math.max(0,Math.round(+x.cloture.compte||0)),detail:normCount(x.cloture.detail),attendu:Math.round(+x.cloture.attendu||0),ts:+x.cloture.ts||0}:null}});return r}
/* ===== Synchronisation Firebase : à remplir avec la configuration du projet ===== */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyCVwWEuzKOxkDf_5pM7ZYs1YJbttX-n0AY",
  authDomain:"caisse-comptoir360.firebaseapp.com",
  projectId:"caisse-comptoir360",
  storageBucket:"caisse-comptoir360.firebasestorage.app",
  messagingSenderId:"260181874588",
  appId:"1:260181874588:web:f5cb44d447e221e7275a59"
};
const FIREBASE_VERSION="13.2.0";

const MIG_TS=Date.now();
function normMvt(m){if(!m||!m.id||!m.pid||!/^\d{4}-\d{2}-\d{2}$/.test(m.jour))return null;return{id:String(m.id),ts:+m.ts||0,jour:m.jour,pid:String(m.pid),nom:String(m.nom||""),refSage:String(m.refSage||""),qte:Math.round(+m.qte||0),type:m.type==="ajustement"?"ajustement":"reassort"}}
function normProduit(p){
  const hasBase=p.stockBase!==undefined;
  const base=hasBase?(p.stockBase==null?null:Math.round(+p.stockBase)):(p.stock==null||p.stock===""||!isFinite(+p.stock)?null:Math.round(+p.stock));
  return{id:String(p.id),nom:String(p.nom||"Produit"),prix:Math.max(0,Math.round(+p.prix||0)),couleur:/^#[0-9a-fA-F]{6}$/.test(p.couleur)?p.couleur:COLORS[1],cat:CATS.includes(p.cat)?p.cat:"Autres",
    stockBase:base,stockTs:hasBase?(+p.stockTs||0):(base==null?0:MIG_TS),stock:base,refSage:String(p.refSage||"").slice(0,40)};
}
function normalizeConfig(c){
  c=c||{};
  return{produits:Array.isArray(c.produits)?c.produits.filter(p=>p&&p.id).map(normProduit):[],dernierTicket:Math.max(0,Math.round(+c.dernierTicket||0)),caisses:normCaisses(c.caisses)};
}

const rawConfig=LS.get("c360_config",null);
let config=normalizeConfig(rawConfig);
let ventes=LS.get("c360_ventes",{});
let pending=LS.get("c360_pending",[]);
let pendingDel=LS.get("c360_pendingDel",[]);
let configDirty=LS.get("c360_cfgDirty",false);
/* mouvements de stock (réassorts, ajustements) : un document par mouvement */
let mvts=LS.get("c360_mvts",null),pendMv=LS.get("c360_pendMv",[]),pendMvDel=LS.get("c360_pendMvDel",[]);
if(!mvts){mvts={};((rawConfig&&rawConfig.mouvements)||[]).forEach(m=>{const x=normMvt(m);if(x){mvts[x.id]=x;pendMv.push(x.id)}})}
function logMvt(p,qte,type){const now=new Date(),m={id:uid(),ts:now.getTime(),jour:dayKey(now),pid:p.id,nom:p.nom,refSage:p.refSage||"",qte,type};mvts[m.id]=m;if(!pendMv.includes(m.id))pendMv.push(m.id);saveLocal()}
function delMvt(id){delete mvts[id];pendMv=pendMv.filter(x=>x!==id);if(!pendMvDel.includes(id))pendMvDel.push(id);saveLocal()}

/* stock = stock de départ + réassorts/ajustements − ventes faites après ce départ (juste même avec plusieurs appareils) */
function recomputeStock(){
  const sold={},mv={};
  config.produits.forEach(p=>{sold[p.id]=0;mv[p.id]=0});
  Object.values(ventes).forEach(v=>{if(!v||!v.items)return;v.items.forEach(i=>{const p=i.pid&&config.produits.find(x=>x.id===i.pid);if(p&&p.stockBase!=null&&(+v.ts||0)>p.stockTs)sold[p.id]+=i.qte})});
  Object.values(mvts).forEach(m=>{const p=config.produits.find(x=>x.id===m.pid);if(p&&p.stockBase!=null&&m.ts>p.stockTs)mv[p.id]+=m.qte});
  config.produits.forEach(p=>{p.stock=p.stockBase==null?null:p.stockBase+mv[p.id]-sold[p.id]});
}
function setStockBase(p,n){p.stockBase=n;p.stockTs=Date.now();}

/* numéro de ticket : une lettre par appareil quand la synchronisation est active */
let appareil=LS.get("c360_appareil","");
const ticketTxt=v=>v&&v.numero?(v.appareil?v.appareil+"-":"")+String(v.numero).padStart(2,"0"):"—";

let ticket=[],remiseObj=null;
let editingSale=null;
let attente=LS.get("c360_attente",[]); // tickets en attente (sur cet appareil)
const saveAttente=()=>LS.set("c360_attente",attente);
let editMode=false,cat="Tout",view="caisse",bilanJour="today";
let db=null,dl=null,syncState="local",syncMode="local";

function saveLocal(){LS.set("c360_config",config);LS.set("c360_ventes",ventes);LS.set("c360_pending",pending);LS.set("c360_pendingDel",pendingDel);LS.set("c360_cfgDirty",configDirty);LS.set("c360_mvts",mvts);LS.set("c360_pendMv",pendMv);LS.set("c360_pendMvDel",pendMvDel)}

/* ---------- connexion Firebase (même interface que la base claude.ai) ---------- */
async function firebaseDb(cfg,cle){
  const app=await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`);
  const fs=await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore.js`);
  const f=fs.getFirestore(app.initializeApp(cfg));
  const root="caisses/"+cle;
  const snap=s=>({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const ref=path=>{const r=fs.doc(f,root+"/"+path);return{
    set:d=>fs.setDoc(r,JSON.parse(JSON.stringify(d))),
    delete:()=>fs.deleteDoc(r),
    onSnapshot:(n,e)=>fs.onSnapshot(r,{includeMetadataChanges:true},s=>n(snap(s)),e)}};
  return{doc:ref,collection:c=>({doc:id=>ref(c+"/"+id),
    onSnapshot:(n,e)=>fs.onSnapshot(fs.collection(f,root+"/"+c),{includeMetadataChanges:true},qs=>n({docs:qs.docs.map(snap),size:qs.size,metadata:qs.metadata}),e)})};
}
const withTimeout=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]);

/* ---------- synchronisation ---------- */
function nPending(){return pending.length+pendingDel.length+pendMv.length+pendMvDel.length+(configDirty?1:0)}
function renderSync(){
  const n=nPending();
  const t={local:"Enregistré sur cet appareil",connecting:"Connexion…",slow:n?`Hors ligne – ${n} envoi(s) en attente`:"Hors ligne – données gardées ici",ok:"Synchronisé",pending:`${n} envoi(s) en attente`,error:"Hors ligne – données gardées ici",readonly:"Lecture seule – données gardées ici",refused:"Code de synchronisation refusé"}[syncState]||"";
  $("#sync").textContent=(appareil&&syncMode==="firebase"?"Appareil "+appareil+" · ":"")+t;
  $("#sdot").className="dot"+(syncState==="ok"?" ok":syncState==="pending"||syncState==="connecting"?" wait":"");
}
function settle(){if(["local","error","readonly","connecting","refused","slow"].includes(syncState))return;syncState=nPending()?"pending":"ok";renderSync()}
let flushing=false,cfgTimer=null;
async function flush(){
  if(!db||flushing||syncState==="readonly"||syncState==="refused")return;flushing=true;
  const T=pr=>withTimeout(pr,15000);
  let ok=true;
  const fail=e=>{ok=false;if(e&&e.code==="invalid_argument")syncState="readonly";if(e&&e.code==="permission-denied")syncState="refused"};
  try{
    for(const id of [...pending]){
      const v=ventes[id];
      if(!v){pending=pending.filter(x=>x!==id);continue}
      try{await T(db.collection("ventes").doc(id).set(v));pending=pending.filter(x=>x!==id);saveLocal()}catch(e){fail(e);break}
    }
    if(ok)for(const id of [...pendingDel]){
      try{await T(db.collection("ventes").doc(id).delete());pendingDel=pendingDel.filter(x=>x!==id);saveLocal()}catch(e){fail(e);break}
    }
    if(ok)for(const id of [...pendMv]){
      const m=mvts[id];
      if(!m){pendMv=pendMv.filter(x=>x!==id);continue}
      try{await T(db.collection("mouvements").doc(id).set(m));pendMv=pendMv.filter(x=>x!==id);saveLocal()}catch(e){fail(e);break}
    }
    if(ok)for(const id of [...pendMvDel]){
      try{await T(db.collection("mouvements").doc(id).delete());pendMvDel=pendMvDel.filter(x=>x!==id);saveLocal()}catch(e){fail(e);break}
    }
    if(ok&&configDirty){
      try{const c=JSON.parse(JSON.stringify(config));c.produits.forEach(p=>delete p.stock);await T(db.doc("caisse/config").set(c));configDirty=false;saveLocal()}catch(e){fail(e)}
    }
    if(ok&&(syncState==="slow"||syncState==="error"))syncState="ok";
  }finally{flushing=false;settle();renderSync()}
}
function pushConfig(){configDirty=true;saveLocal();renderSync();clearTimeout(cfgTimer);cfgTimer=setTimeout(flush,700)}

function mergeCollection(qs,getLocal,pend,pendDel){
  const server={};qs.docs.forEach(d=>{server[d.id]=JSON.parse(JSON.stringify(d.data()))});
  const local=getLocal();
  if(!qs.metadata.fromCache){
    pend.forEach(id=>{if(local[id])server[id]=local[id]});
    pendDel.forEach(id=>{delete server[id]});
    return server;
  }
  const out={...local,...server};pendDel.forEach(id=>{delete out[id]});return out;
}

async function initDb(){
  const C=typeof claude!=="undefined"&&claude&&claude.use?claude:null;
  if(C){try{dl=await C.use("downloads")}catch(e){dl=null}}
  const cle=LS.get("c360_synckey","");
  if(FIREBASE_CONFIG&&cle){
    syncState="connecting";renderSync();
    try{db=await firebaseDb(FIREBASE_CONFIG,cle);syncMode="firebase"}catch(e){db=null;syncState="slow";syncMode="firebase";renderSync()}
  }
  if(!db&&C&&syncMode!=="firebase"){try{db=await C.use("db");if(db)syncMode="claude"}catch(e){db=null}}
  if(view==="bilan")renderBilan();
  if(!db){if(syncMode!=="firebase")syncState="local";renderSync();return}
  syncState="connecting";renderSync();
  const timer=setTimeout(()=>{if(syncState==="connecting"){syncState="slow";renderSync()}},10000);
  const onErr=e=>{syncState=e&&e.code==="permission-denied"?"refused":"error";renderSync()};
  const online=()=>{clearTimeout(timer);if(syncState==="connecting"||syncState==="slow"||syncState==="error")syncState="ok"};
  let cfgChecked=false;
  db.doc("caisse/config").onSnapshot(snap=>{
    if(!snap.metadata.fromCache)online();
    if(snap.exists){if(!configDirty){config=normalizeConfig(JSON.parse(JSON.stringify(snap.data())));saveLocal();renderAll()}}
    else if(!snap.metadata.fromCache&&!cfgChecked&&config.produits.length){pushConfig()}
    if(!snap.metadata.fromCache)cfgChecked=true;
    settle();
  },onErr);
  db.collection("ventes").onSnapshot(qs=>{
    if(!qs.metadata.fromCache)online();
    ventes=mergeCollection(qs,()=>ventes,pending,pendingDel);
    saveLocal();settle();renderAll();
  },onErr);
  db.collection("mouvements").onSnapshot(qs=>{
    if(!qs.metadata.fromCache)online();
    const m=mergeCollection(qs,()=>mvts,pendMv,pendMvDel);mvts={};Object.values(m).forEach(x=>{const y=normMvt(x);if(y)mvts[y.id]=y});
    saveLocal();settle();renderAll();
  },onErr);
  flush();setInterval(flush,15000);
  window.addEventListener("online",flush);
}

function mountKeypad(el,get,set,entier){
  el.className="kp noselect";
  el.innerHTML=["1","2","3","4","5","6","7","8","9",entier?"C":",","0","⌫"].map(k=>`<button data-k="${k}">${k}</button>`).join("");
  el.onclick=e=>{
    const b=e.target.closest("[data-k]");if(!b)return;buzz();let v=get();const k=b.dataset.k;
    if(k==="⌫")v=v.slice(0,-1);
    else if(k==="C")v="";
    else if(entier&&v.length>=4)return;
    else if(k===","){if(!v.includes(","))v=(v||"0")+","}
    else{if(v.includes(",")&&v.split(",")[1].length>=2)return;if(v.replace(",","").length>=7)return;if(v==="0")v="";v+=k}
    set(v);
  };
}

function openAttente(){

      <div class="two" style="margin:6px 0 12px"><button class="btn danger" data-adel="${esc(a.id)}">Supprimer</button><button class="btn primary" data-ago="${esc(a.id)}">Reprendre</button></div>`).join("")}</div>
    <button class="btn" data-close>Fermer</button>`,s=>{

      ticket=a.items.map(l=>({...l}));remiseObj=a.remiseObj;saveAttente();closeModal();$("#ticket").classList.add("open");renderAll();toast(a.nom?`Ticket de ${a.nom} repris`:"Ticket repris");
    });

  });
}

function startFix(v){

function mountCounter(el,init,onChange){
  const q={...init};
  el.innerHTML=`<div class="cnt">${DENOMS.map(d=>`<div class="crow ${d>=500?"bill":""}"><span class="cl">${denLabel(d)}</span><button class="qb" data-m="${d}">−</button><input inputmode="numeric" data-d="${d}" value="${q[d]||""}" placeholder="0"><button class="qb" data-p="${d}">+</button><span class="cs" data-s="${d}">${q[d]?eur(d*q[d]):""}</span></div>`).join("")}</div>`;
  const upd=d=>{el.querySelector(`[data-d="${d}"]`).value=q[d]||"";el.querySelector(`[data-s="${d}"]`).textContent=q[d]?eur(d*q[d]):"";onChange(countTotal(q),{...q})};
  el.onclick=e=>{const b=e.target.closest("button");if(!b)return;buzz();const d=+(b.dataset.m||b.dataset.p);q[d]=Math.max(0,(q[d]||0)+(b.dataset.p?1:-1));if(!q[d])delete q[d];upd(d)};
  el.oninput=e=>{const i=e.target.closest("[data-d]");if(!i)return;const d=+i.dataset.d;const v=parseInt(i.value.replace(/\D/g,""),10);if(v>0)q[d]=Math.min(9999,v);else delete q[d];el.querySelector(`[data-s="${d}"]`).textContent=q[d]?eur(d*q[d]):"";onChange(countTotal(q),{...q})};
  onChange(countTotal(q),{...q});
}

/* ---------- bilan ---------- */
function bars(rows,fmt){
  const max=Math.max(1,...rows.map(r=>r.v));
  return rows.length?rows.map(r=>`<div class="bar"><span class="nm">${r.n}</span><span class="track"><span class="fill" style="width:${Math.max(3,r.v/max*100)}%"></span></span><span class="vv">${fmt(r)}</span></div>`).join(""):`<p class="muted" style="margin:0">Aucune donnée</p>`;
}
function renderBilan(){
  recomputeStock();
  const all=Object.values(ventes).filter(v=>v&&v.id).sort((a,b)=>b.ts-a.ts);
  const today=dayKey();
  const sel=bilanJour==="all"?all:all.filter(v=>v.jour===(bilanJour==="today"?today:bilanJour));
  const jours=[...new Set(all.map(v=>v.jour))].filter(j=>j!==today).sort().reverse();
  const ca=sel.reduce((s,v)=>s+v.total,0),nb=sel.length;
  const art=sel.reduce((s,v)=>s+v.items.reduce((a,i)=>a+i.qte,0),0);
  const rem=sel.reduce((s,v)=>s+(v.remise||0),0);
  const byPay={};sel.forEach(v=>{byPay[v.paiement]=byPay[v.paiement]||{v:0,c:0};byPay[v.paiement].v+=v.total;byPay[v.paiement].c++});
  const byP={};sel.forEach(v=>v.items.forEach(i=>{byP[i.nom]=byP[i.nom]||{n:esc(i.nom),q:0,v:0};byP[i.nom].q+=i.qte;byP[i.nom].v+=i.qte*i.prix}));
  const byCat={};sel.forEach(v=>v.items.forEach(i=>{byCat[i.cat]=(byCat[i.cat]||0)+i.qte*i.prix}));
  const byH={};sel.forEach(v=>{const h=v.heure??new Date(v.ts).getHours();byH[h]=(byH[h]||0)+v.total});
  const label=bilanJour==="all"?"Toutes les ventes":bilanJour==="today"?"Aujourd'hui":dayLabel(bilanJour);
  const w=$("#bwrap");
  w.innerHTML=`
    <h2>Bilan · ${esc(label)}</h2>
    <div class="chips"><button class="chip ${bilanJour==="today"?"on":""}" data-j="today">Aujourd'hui</button>${jours.map(j=>`<button class="chip ${bilanJour===j?"on":""}" data-j="${j}">${esc(dayLabel(j))}</button>`).join("")}<button class="chip ${bilanJour==="all"?"on":""}" data-j="all">Tout</button></div>
    <div class="kpis">
      <div class="kpi main"><div class="l">Chiffre d'affaires TTC</div><div class="v">${eur(ca)}</div></div>
      <div class="kpi"><div class="l">Ventes</div><div class="v">${nb}</div></div>
      <div class="kpi"><div class="l">Panier moyen</div><div class="v">${eur(nb?Math.round(ca/nb):0)}</div></div>
      <div class="kpi"><div class="l">Articles vendus</div><div class="v">${art}</div></div>
    </div>
    <div class="cards">
      <div class="card"><h3>Paiements</h3>${bars(Object.keys(PAY).filter(k=>byPay[k]).map(k=>({n:PAY[k],v:byPay[k].v,c:byPay[k].c})),r=>`${eur(r.v)} <span class="muted">(${r.c})</span>`)}
        ${rem?`<p class="muted" style="margin:6px 0 0">Remises accordées : <b style="color:var(--ink)">${eur(rem)}</b></p>`:""}</div>
      <div class="card"><h3>Meilleures ventes</h3>${bars(Object.values(byP).sort((a,b)=>b.v-a.v).slice(0,8),r=>`${r.q} × · ${eur(r.v)}`)}</div>
      <div class="card"><h3>Par rayon</h3>${bars(Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({n:esc(k),v})),r=>eur(r.v))}</div>
      <div class="card"><h3>Par heure</h3>${bars(Object.keys(byH).map(Number).sort((a,b)=>a-b).map(h=>({n:`${h} h – ${h+1} h`,v:byH[h]})),r=>eur(r.v))}</div>
    </div>
    ${bilanJour!=="all"?`<div style="margin-top:10px">${caisseCard(bilanJour==="today"?today:bilanJour)}</div>`:""}
    ${stockCard()}
    <div class="card" style="margin-top:10px"><h3>Détail des ventes</h3>${sel.length?sel.map(v=>`<div class="sale"><span class="t">${new Date(v.ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span><span class="d"><b>${v.items.map(i=>`${i.qte} × ${esc(i.nom)}`).join(", ")}</b><br>Ticket n° ${ticketTxt(v)}${v.corrige?`<span class="tag-mod">corrigé</span>`:""} · ${PAY[v.paiement]||esc(v.paiement)}${bilanJour==="all"?" · "+esc(dayLabel(v.jour)):""}${v.remise?` · remise ${eur(v.remise)}`:""}</span><span class="s">${eur(v.total)}</span><button class="del fx" data-fix="${esc(v.id)}">Corriger</button></div>`).join(""):`<p class="muted" style="margin:0">Aucune vente sur cette période.</p>`}</div>
    <div class="exports">
      <button class="btn dark" id="xsage" ${sel.length?"":"disabled"}>Export Sage (par jour et par règlement)</button>
      <button class="btn line" id="xcsv" ${sel.length?"":"disabled"}>Export détaillé (ticket par ticket)</button>
    </div>
    ${syncCard()}
    <div class="card" style="margin-top:14px"><h3>Transférer vers un autre appareil</h3>
      <p class="muted" style="margin:0 0 10px;font-size:14px">Envoie toute la caisse (produits, stock, ventes, fond de caisse, tickets en attente) vers un autre téléphone ou une tablette, par AirDrop, même sans Internet. Sur l'autre appareil, touchez « Recevoir ».</p>
      <div class="exports" style="margin-top:0"><button class="btn dark" id="xsend">Envoyer la caisse</button><label class="btn line" style="display:flex;align-items:center;justify-content:center;cursor:pointer;flex:1;min-width:180px">Recevoir une caisse<input type="file" id="xrecv" accept=".json,application/json,text/plain" hidden></label></div>
    </div>
    <p class="muted" style="margin-top:14px;font-size:14px">${db?(syncState==="ok"?"Les ventes de tous les appareils connectés apparaissent ici.":"Les ventes sont gardées sur cet appareil et partiront dès le retour de la connexion."):"Les ventes sont enregistrées sur cet appareil, même sans Internet. Exportez le bilan en fin de journée."}</p>`;
  const adj=(id,d)=>{const p=config.produits.find(x=>x.id===id);if(!p||p.stock==null)return;if(p.stock+d<0)return;logMvt(p,d,"ajustement");settle();flush();renderBilan();renderGrid()};
  w.querySelectorAll("[data-sset]").forEach(b=>b.onclick=()=>openStockSet(b.dataset.sset));
  const br=w.querySelector("#breass");if(br)br.onclick=openReassort;
  w.querySelectorAll("[data-mvdel]").forEach(b=>b.onclick=()=>{const m=mvts[b.dataset.mvdel];if(!m)return;confirmBox(`Annuler le réassort de ${m.qte} × ${m.nom} ?`,"Annuler le réassort",()=>{delMvt(m.id);settle();flush();renderBilan();renderGrid();toast("Réassort annulé")})});
  w.querySelectorAll("[data-sm]").forEach(b=>b.onclick=()=>adj(b.dataset.sm,-1));
  w.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>adj(b.dataset.sp,1));
  const bf=w.querySelector("#bfond");if(bf)bf.onclick=()=>openFond(null);
  const bc=w.querySelector("#bclot");if(bc)bc.onclick=()=>openCloture(bilanJour==="today"?today:bilanJour);
  w.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{bilanJour=b.dataset.j;renderBilan()});
  w.querySelectorAll("[data-fix]").forEach(b=>b.onclick=()=>openSaleFix(b.dataset.fix));
  const per=bilanJour==="all"?"toutes":bilanJour==="today"?today:bilanJour;
  bindSyncCard(w);
  $("#xsend").onclick=sendCaisse;
  $("#xrecv").onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)receiveCaisse(f)};
  $("#xsage").onclick=()=>exportFile(`sage-${per}.csv`,buildSageCsv(sel));
  $("#xcsv").onclick=()=>exportFile(`ventes-detail-${per}.csv`,buildCsv(sel));
}
/* ---------- transfert entre appareils ---------- */
function sendCaisse(){
  const data={app:"caisse-comptoir360",version:2,envoyeLe:Date.now(),config,ventes,mvts,attente,dernierTicket:Math.max(LS.get("c360_dernierTicket",0),config.dernierTicket||0)};
  const d=new Date(),stamp=dayKey(d)+"-"+String(d.getHours()).padStart(2,"0")+"h"+String(d.getMinutes()).padStart(2,"0");
  exportFile(`caisse-comptoir360-${stamp}.json`,JSON.stringify(data),"application/json",true);
}
function receiveCaisse(file){
  const r=new FileReader();
  r.onerror=()=>toast("Fichier illisible");
  r.onload=()=>{
    let d;try{d=JSON.parse(String(r.result).replace(/^\ufeff/,""))}catch(e){d=null}
    if(!d||d.app!=="caisse-comptoir360"||!d.config||typeof d.ventes!=="object"){openModal(`<h2 class="mt">Fichier non reconnu</h2><p class="sub">Choisissez le fichier « caisse-comptoir360-… .json » envoyé depuis l'autre appareil.</p><button class="btn" data-close>Fermer</button>`);return}
    const nv=Object.values(d.ventes||{}).filter(v=>v&&v.id),np=(d.config.produits||[]).length;
    const ici=Object.keys(ventes).length;
    openModal(`<h2 class="mt">Recevoir cette caisse ?</h2>
      <p class="sub">Envoyée le ${esc(new Date(+d.envoyeLe||0).toLocaleString("fr-FR",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}</p>
      <div class="rendu idle" style="text-align:left;font-size:15px;color:var(--ink)">${np} produit(s) avec leur stock · ${nv.length} vente(s) · fond de caisse et réassorts</div>
      <p class="sub" style="margin-top:12px">Les produits, le stock et le fond de caisse de cet appareil seront remplacés par ceux reçus.${ici?` Les ${ici} vente(s) déjà présentes ici sont conservées.`:""}</p>
      <div class="two"><button class="btn" data-close>Annuler</button><button class="btn primary" id="rcok">Recevoir</button></div>`,s=>{
      s.querySelector("#rcok").onclick=()=>{
        const merged={...ventes};
        nv.forEach(v=>{const cur=merged[v.id];if(!cur||(+v.corrige||0)>=(+cur.corrige||0))merged[v.id]=v});
        ventes=merged;
        config=normalizeConfig(d.config);
        if(Array.isArray(d.config.mouvements))d.config.mouvements.forEach(m=>{const x=normMvt(m);if(x&&!mvts[x.id]){mvts[x.id]=x;pendMv.push(x.id)}});
        if(d.mvts&&typeof d.mvts==="object")Object.values(d.mvts).forEach(m=>{const x=normMvt(m);if(x&&!mvts[x.id]){mvts[x.id]=x;pendMv.push(x.id)}});
        const hw=Math.max(+d.dernierTicket||0,config.dernierTicket||0,LS.get("c360_dernierTicket",0),...Object.values(ventes).map(v=>+v.numero||0));
        config.dernierTicket=hw;LS.set("c360_dernierTicket",hw);
        if(Array.isArray(d.attente))attente=d.attente.filter(a=>a&&a.id&&Array.isArray(a.items));saveAttente();
        Object.keys(ventes).forEach(id=>{if(!pending.includes(id))pending.push(id)});
        saveLocal();pushConfig();closeModal();renderAll();toast("Caisse reçue");
      };
    });
  };
  r.readAsText(file);
}

async function exportFile(name,body,type,noBom){
  type=type||"text/csv";
  const text=(noBom?"":"\ufeff")+body;
  if(dl){try{await dl.save({filename:name,data:text});return}catch(e){}}
  try{const file=new File([text],name,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Caisse Comptoir 360"});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return}catch(e){}
  showCsv(body);
}
function stockCard(){
  const jour=bilanJour==="all"?null:(bilanJour==="today"?dayKey():bilanJour);
  const ps=config.produits.filter(p=>p.stock!=null).sort((a,b)=>a.stock-b.stock||a.nom.localeCompare(b.nom,"fr"));
  const vendu={},reass={};
  if(jour){Object.values(ventes).filter(v=>v&&v.jour===jour).forEach(v=>v.items.forEach(i=>{if(i.pid)vendu[i.pid]=(vendu[i.pid]||0)+i.qte}));
    Object.values(mvts).filter(m=>m.jour===jour&&m.type==="reassort").forEach(m=>{reass[m.pid]=(reass[m.pid]||0)+m.qte})}
  const mv=Object.values(mvts).filter(m=>m.type==="reassort"&&(!jour||m.jour===jour)).sort((a,b)=>b.ts-a.ts);
  const head=`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px"><h3 style="margin:0">Stock</h3><button class="chip on" id="breass">+ Faire un réassort</button></div>`;
  if(!ps.length)return`<div class="card" style="margin-top:10px">${head}<p class="muted" style="margin:0">Aucun stock suivi. Dans Produits, touchez un produit et indiquez son stock, ou faites un réassort.</p></div>`;
  const val=ps.reduce((s,p)=>s+Math.max(0,p.stock)*p.prix,0);
  const alertes=ps.filter(p=>p.stock<=SEUIL).length;
  return`<div class="card" style="margin-top:10px">${head}
    <p class="muted" style="margin:0 0 8px;font-size:14px">${ps.length} produit(s) suivi(s) · valeur au prix de vente : <b style="color:var(--ink)">${eur(val)}</b>${alertes?` · <b style="color:var(--warn)">${alertes} à réapprovisionner</b>`:""}</p>
    ${ps.map(p=>`<div class="srow"><span class="sdot" style="background:${esc(p.couleur)}"></span><span class="sn">${esc(p.nom)}<small>${esc(p.cat)}${jour&&(vendu[p.id]||reass[p.id])?` · ${vendu[p.id]?`vendu ${vendu[p.id]}`:""}${vendu[p.id]&&reass[p.id]?" · ":""}${reass[p.id]?`<b style="color:#1e3a8a">réassort +${reass[p.id]}</b>`:""}`:""}</small></span><button class="stk sset ${p.stock<=0?"out":p.stock<=SEUIL?"low":"okk"}" data-sset="${esc(p.id)}">${p.stock<=0?"Épuisé":p.stock}</button><button class="qb" data-sm="${esc(p.id)}">−</button><button class="qb" data-sp="${esc(p.id)}">+</button></div>`).join("")}
    ${mv.length?`<h3 style="margin:16px 0 4px">Réassorts${jour?" du jour":""}</h3>${mv.map(m=>`<div class="sale"><span class="t">${new Date(m.ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span><span class="d"><b>+${m.qte} × ${esc(m.nom)}</b>${jour?"":"<br>"+esc(dayLabel(m.jour))}</span><button class="del" data-mvdel="${esc(m.id)}">Annuler</button></div>`).join("")}`:""}
  </div>`;
}
function openReassort(){
  recomputeStock();
  const ps=[...config.produits].sort((a,b)=>((a.stock??999)-(b.stock??999))||a.nom.localeCompare(b.nom,"fr"));
  if(!ps.length){toast("Créez d'abord vos produits");return}
  const q={};
  openModal(`<h2 class="mt">Réassort</h2><p class="sub">Indiquez les quantités ajoutées en stock. Les produits épuisés sont en haut.</p>
    <div class="cnt" id="rl">${ps.map(p=>`<div class="rrow"><span class="sdot" style="background:${esc(p.couleur)}"></span><span class="sn">${esc(p.nom)}<small>${p.stock==null?"stock non suivi":p.stock<=0?'<b style="color:var(--warn)">Épuisé</b>':"en stock : "+p.stock}</small></span><button class="qb" data-m="${esc(p.id)}">−</button><input inputmode="numeric" data-r="${esc(p.id)}" placeholder="0"><button class="qb" data-p="${esc(p.id)}">+</button></div>`).join("")}</div>
    <div class="rendu idle" id="rtot" style="margin-top:12px">Aucun article ajouté</div>
    <div class="two"><button class="btn" data-close>Annuler</button><button class="btn primary" id="rok" disabled>Valider le réassort</button></div>`,s=>{
    const upd=()=>{const n=Object.values(q).reduce((a,b)=>a+b,0),k=Object.keys(q).length;s.querySelector("#rtot").textContent=n?`${n} article(s) ajouté(s) sur ${k} produit(s)`:"Aucun article ajouté";s.querySelector("#rok").disabled=!n};
    const set=(id,v)=>{if(v>0)q[id]=Math.min(9999,v);else delete q[id];s.querySelector(`[data-r="${CSS.escape(id)}"]`).value=q[id]||"";upd()};
    s.querySelector("#rl").onclick=e=>{const b=e.target.closest("button");if(!b)return;buzz();const id=b.dataset.m||b.dataset.p;set(id,(q[id]||0)+(b.dataset.p?1:-1))};
    s.querySelector("#rl").oninput=e=>{const i=e.target.closest("[data-r]");if(!i)return;const v=parseInt(i.value.replace(/\D/g,""),10);if(v>0)q[i.dataset.r]=Math.min(9999,v);else delete q[i.dataset.r];upd()};
    s.querySelector("#rok").onclick=()=>{
      let cfgCh=false;Object.entries(q).forEach(([id,n])=>{const p=config.produits.find(x=>x.id===id);if(!p)return;if(p.stockBase==null){p.stockBase=0;p.stockTs=Date.now()-1;cfgCh=true}logMvt(p,n,"reassort")});if(cfgCh)pushConfig();settle();flush();
      pushConfig();closeModal();renderAll();toast("Réassort enregistré");
    };
  });
}
/* Export pour la saisie Sage : par jour, puis par mode de règlement, une ligne par référence */
function buildSageCsv(list){
  const n=c=>(c/100).toFixed(2).replace(".",",");
  const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  const longDay=k=>{const[y,m,d]=k.split("-").map(Number);const s=new Date(y,m-1,d).toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});return s.charAt(0).toUpperCase()+s.slice(1)};
  const rows=[];const blank=()=>rows.push([]);
  const jours=[...new Set(list.map(v=>v.jour))].sort();
  rows.push(["RÉCAPITULATIF POUR SAISIE SAGE – Comptoir 360"]);
  rows.push([jours.length?`Période : ${longDay(jours[0])}${jours.length>1?" au "+longDay(jours[jours.length-1]):""}`:""]);
  let manque=0,grand=0;
  jours.forEach(j=>{
    const vj=list.filter(v=>v.jour===j);const totJ=vj.reduce((s,v)=>s+v.total,0);grand+=totJ;
    blank();blank();
    rows.push([`=== ${longDay(j).toUpperCase()} ===`,"","","",`Total du jour : ${n(totJ)} €`]);
    Object.keys(PAY).forEach(m=>{
      const vm=vj.filter(v=>v.paiement===m);if(!vm.length)return;
      const totM=vm.reduce((s,v)=>s+v.total,0),rem=vm.reduce((s,v)=>s+(v.remise||0),0);
      const nums=vm.filter(v=>+v.numero).sort((a,b)=>a.ts-b.ts).map(ticketTxt);
      blank();
      rows.push([`RÈGLEMENT : ${PAY[m].toUpperCase()}`,"",`${vm.length} ticket(s)`,"",`${n(totM)} €`]);
      rows.push(["Code Sage","Désignation","Quantité","Prix unitaire TTC","Total TTC"]);
      const g={};
      vm.forEach(v=>v.items.forEach(i=>{const p=!i.refSage&&i.pid&&config.produits.find(x=>x.id===i.pid);const ref=i.refSage||(p&&p.refSage)||"";const k=(ref||"#"+i.nom)+"|"+i.prix;g[k]=g[k]||{ref,nom:i.nom,prix:i.prix,qte:0};g[k].qte+=i.qte}));
      Object.values(g).sort((a,b)=>(a.ref||"zzz"+a.nom).localeCompare(b.ref||"zzz"+b.nom,"fr")).forEach(l=>{if(!l.ref)manque++;rows.push([l.ref||"⚠ À COMPLÉTER",l.nom,l.qte,n(l.prix),n(l.qte*l.prix)])});
      if(rem)rows.push(["","Remises accordées","","",n(-rem)]);
      rows.push(["",`TOTAL ${PAY[m].toUpperCase()}`,"","",n(totM)]);
      if(nums.length)rows.push(["",`Tickets n° ${nums.join(", ")}`]);
    });
    const ra=Object.values(mvts).filter(m=>m.jour===j&&m.type==="reassort");
    if(ra.length){
      blank();rows.push(["RÉASSORTS (entrées en stock)"]);rows.push(["Code Sage","Désignation","Quantité ajoutée","Heure"]);
      const gr={};ra.forEach(m=>{const p=!m.refSage&&config.produits.find(x=>x.id===m.pid);const ref=m.refSage||(p&&p.refSage)||"";const k=m.pid;gr[k]=gr[k]||{ref,nom:m.nom,qte:0,h:[]};gr[k].qte+=m.qte;gr[k].h.push(new Date(m.ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}))});
      Object.values(gr).forEach(g=>{if(!g.ref)manque++;rows.push([g.ref||"⚠ À COMPLÉTER",g.nom,g.qte,g.h.join(", ")])});
    }
    blank();
    rows.push(["",`TOTAL ${longDay(j).toUpperCase()}`,"","",n(totJ)]);
    Object.keys(PAY).forEach(m=>{const t=vj.filter(v=>v.paiement===m).reduce((s,v)=>s+v.total,0);if(t)rows.push(["",`   dont ${PAY[m]}`,"","",n(t)])});
  });
  if(jours.length>1){blank();blank();rows.push(["","TOTAL DE LA PÉRIODE","","",n(grand)]);Object.keys(PAY).forEach(m=>{const t=list.filter(v=>v.paiement===m).reduce((s,v)=>s+v.total,0);if(t)rows.push(["",`   dont ${PAY[m]}`,"","",n(t)])})}
  if(manque){blank();rows.push([`⚠ ${manque} ligne(s) sans code Sage : à compléter dans la fiche produit de la caisse.`])}
  return rows.map(r=>r.map(q).join(";")).join("\r\n");
}
function buildCsv(list){
  const n=c=>(c/100).toFixed(2).replace(".",",");
  const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  const rows=[["N° ticket","Date","Heure","Paiement","Réf. Sage","Produit","Rayon","Quantité","Prix unitaire","Total ligne","Remise ticket","Total ticket"]];
  [...list].sort((a,b)=>a.ts-b.ts).forEach(v=>{const d=new Date(v.ts);v.items.forEach((i,k)=>{const p=!i.refSage&&i.pid&&config.produits.find(x=>x.id===i.pid);rows.push([`="${ticketTxt(v)}"`,d.toLocaleDateString("fr-FR"),d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),PAY[v.paiement]||v.paiement,i.refSage||(p&&p.refSage)||"",i.nom,i.cat,i.qte,n(i.prix),n(i.prix*i.qte),k===0?n(v.remise||0):"",k===0?n(v.total):""])})});
  return rows.map(r=>r.map(q).join(";")).join("\r\n");
}
function showCsv(text){
  openModal(`<h2 class="mt">Export des ventes</h2><p class="sub">Sélectionnez tout, copiez, puis collez dans Excel ou un e-mail.</p><textarea class="csv" readonly>${esc(text)}</textarea><button class="btn" data-close style="margin-top:12px">Fermer</button>`,s=>{const t=s.querySelector("textarea");t.focus();t.select()});
}
